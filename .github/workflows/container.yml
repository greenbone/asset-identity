name: Build and Push Container Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref-name:
        type: string
        description: "The ref to build a container image from. For example a tag v1.0.0."
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref-name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.repository == 'greenbone/asset-identity' }}
    name: Build and Push Container Images (stable)
    uses: greenbone/workflows/.github/workflows/container-build-push-gea.yml@main
    with:
      ref: ${{ inputs.ref-name }}
      ref-name: ${{ inputs.ref-name }}
      name: stable
      dockerfile: .docker/Dockerfile
      labels: |
        org.opencontainers.image.vendor=Greenbone
        org.opencontainers.image.base.name=busybox:stable
      images: |
        ghcr.io/${{ github.repository }},enable=true
    secrets: inherit

