name: Build and run unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-run-unit-tests:
    name: Build and run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install C build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ libc6-dev libglib2.0-dev cmake make pkg-config curl ca-certificates
      - name: Install Cgreen
        run: sh .github/scripts/install-cgreen.sh
      - name: Download Go dependencies
        run: go mod download
      - name: Build and test
        run: make test
      - name: Test without cgo
        run: CGO_ENABLED=0 go test ./...
      - name: Check for data races
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Test staged installation
        run: make test-install VERSION=1.2.3

  go-linting:
    name: Run Go Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install GLib headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-dev pkg-config
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.0
          install-mode: goinstall
          args: --timeout=5m

  go-format-check:
    name: Check Go Source Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.0
      - name: Run Go formatter
        run: make format
      - name: Check for diffs after formatting
        run: git diff --exit-code
